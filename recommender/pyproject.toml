[project]
name = "ferremax-recommender"
version = "0.1.0"
description = "FerreMax v2 · recomendador (FP-Growth, CF ítem-ítem, LightGBM) y búsqueda por necesidad"
readme = "README.md"
authors = [
    { name = "Erik H", email = "erikhereale@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "mlxtend>=0.25.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "snowballstemmer>=3.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ferremax-recommender = "ferremax_recommender:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
